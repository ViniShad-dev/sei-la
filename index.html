:root {
  color-scheme: dark;
  --bg: #111310;
  --panel: #191b17;
  --panel2: #20221c;
  --line: #ffffff12;
  --muted: #929585;
  --text: #e9e7dc;
  --gold: #d6b57a;
  --orange: #ec9253;
  --green: #a4bd84;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "DM Sans", Arial, sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
}
button,
input,
select {
  font: inherit;
}
button {
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}
button {
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 6px;
  transition:
    background 0.2s,
    transform 0.2s;
}
button:hover:not(:disabled) {
  background: #30332a;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button svg {
  vertical-align: middle;
  flex-shrink: 0;
}
.app-header {
  height: 86px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
  background: #151713;
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}
.brand-mark {
  color: var(--gold);
  border: 1px solid #b18f524d;
  width: 42px;
  height: 46px;
  display: grid;
  place-items: center;
  background: #d6b57a08;
  border-radius: 6px;
}
.brand h1 {
  font: 600 24px var(--serif);
  letter-spacing: 2px;
  margin: 0;
}
.brand p {
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--gold);
  margin: 5px 0 0;
}
.header-right {
  display: flex;
  gap: 20px;
  align-items: center;
}
.save-state {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 7px;
  align-items: center;
}
.dot {
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  display: inline-block;
}
.icon-button {
  width: 34px;
  height: 34px;
  background: transparent;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.topbar {
  padding: 15px 32px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: #171914;
}
.breadcrumb {
  font-size: 11px;
  color: var(--muted);
}
.breadcrumb strong {
  color: var(--gold);
  font-weight: 500;
}
.live {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 7px;
}
.shell {
  max-width: 1600px;
  margin: auto;
  display: grid;
  grid-template-columns: 210px minmax(350px, 1fr) 370px;
  min-height: calc(100vh - 134px);
}
.sidebar {
  padding: 27px 16px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.nav-label,
.eyebrow {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  font-weight: 600;
}
.nav-label {
  padding: 0 14px;
  margin-bottom: 14px;
}
.nav-item {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  margin: 2px 0;
  color: #a8ab9c;
  font-size: 12px;
}
.nav-item.active {
  background: #d6b57a10;
  color: var(--gold);
  box-shadow: inset 2px 0 var(--gold);
}
.nav-item .badge {
  margin-left: auto;
  font-size: 9px;
  color: var(--gold);
  border: 1px solid #b18f5233;
  padding: 2px 5px;
  border-radius: 4px;
}
.sidebar-rule {
  height: 1px;
  background: var(--line);
  margin: 20px 14px;
}
.sidebar-bottom {
  margin-top: auto;
  padding: 35px 12px 0;
}
.legacy {
  border: 1px solid #c59a5430;
  border-radius: 8px;
  background: linear-gradient(135deg, #a77d3510, transparent);
  padding: 17px 12px;
  color: var(--gold);
}
.legacy h4 {
  font: 600 18px var(--serif);
  margin: 10px 0 6px;
}
.legacy p {
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0 0 12px;
}
.legacy button {
  font-size: 10px;
  width: 100%;
  padding: 9px;
  color: var(--gold);
  background: #d6b57a0b;
  border-color: #d6b57a33;
}
.version {
  font-size: 9px;
  color: #626759;
  letter-spacing: 1px;
  padding-top: 20px;
  text-align: center;
}
.center {
  min-width: 0;
  padding: 26px 30px 20px;
  background: radial-gradient(ellipse at 50% 45%, #56351910, transparent 60%);
}
.page-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.page-title h2 {
  font: 500 30px var(--serif);
  margin: 0 0 7px;
}
.page-title p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
}
.chapter {
  border: 1px solid #d6b57a30;
  padding: 6px 9px;
  border-radius: 4px;
  font-size: 9px;
  color: var(--gold);
  white-space: nowrap;
}
.resources {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-top: 25px;
  background: #1e20195c;
}
.resource {
  padding: 16px 17px;
  min-width: 0;
}
.resource + .resource {
  border-left: 1px solid var(--line);
}
.resource label {
  color: var(--muted);
  font-size: 9px;
  display: flex;
  gap: 7px;
  align-items: center;
}
.resource label svg {
  color: var(--gold);
  width: 13px;
  height: 13px;
}
.resource strong {
  font: 600 26px var(--serif);
  display: block;
  margin-top: 7px;
  font-variant-numeric: tabular-nums;
}
.resource:first-child strong {
  color: var(--gold);
}
.resource small {
  color: var(--muted);
  font-size: 9px;
}
.forge-stage {
  height: 440px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  isolation: isolate;
  overflow: hidden;
}
.forge-stage:before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(ellipse, #b5762820, transparent 67%);
  z-index: -1;
}
.orbit {
  position: absolute;
  border: 1px solid #d6b57a0d;
  border-radius: 50%;
  width: 292px;
  height: 292px;
  top: 55px;
  pointer-events: none;
}
.orbit:after {
  content: "";
  position: absolute;
  border: 1px dashed #d6b57a12;
  border-radius: 50%;
  inset: 19px;
}
.orbit.outer {
  width: 350px;
  height: 350px;
  top: 26px;
  border-color: #d6b57a06;
}
.sword-button {
  background: none;
  border: 0;
